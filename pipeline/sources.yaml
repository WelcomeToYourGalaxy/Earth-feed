# Frontline Feed — source roster
#
# EVERY url in this file must pass `python -m pipeline.verify_sources` before it
# ships. Sources that fail are written to source_status.json with the reason and
# are skipped by the harvester until fixed. Nothing enters the feed unverified.
#
# tier:    peer_reviewed | preprint | institutional | journalism
# regions: hint only. Real region tags come from place extraction in tagger.py.
#          Used to balance the harvest budget, not to label the output.
# lang:    source language. Non-English sources are extracted in-language and the
#          resulting fact is translated; the anchor stays in the original.

defaults:
  lookback_days: 30
  # null here means take everything in the window. OpenAlex pages with a
  # cursor; RSS returns whatever the feed carries. Set a number to cap.
  max_items_per_source: null

sources:

  # ─────────────────────────────────────────────────────────────────────
  # PEER-REVIEWED — place-keyed, not author-keyed.
  # OpenAlex is the main lever against geographic bias: it finds papers
  # ABOUT a region regardless of where the authors are based.
  # ─────────────────────────────────────────────────────────────────────

  - id: openalex-congo-basin
    name: OpenAlex — Congo Basin
    kind: openalex
    max_items_per_source: 150
    query: "Congo Basin OR Cuvette Centrale OR Salonga OR Sangha Trinational"
    concepts: [environmental science, ecology, forestry]
    tier: peer_reviewed
    regions: [middle_africa]
    lang: "en"
  - id: openalex-central-asia
    name: OpenAlex — Central Asia
    kind: openalex
    max_items_per_source: 150
    query: "Aral Sea OR Amu Darya OR Syr Darya OR Kazakhstan steppe OR Tien Shan glacier"
    concepts: [environmental science, hydrology]
    tier: peer_reviewed
    regions: [central_asia]
    lang: "en"
  - id: openalex-myanmar
    name: OpenAlex — Myanmar
    kind: openalex
    max_items_per_source: 150
    query: "Myanmar OR Irrawaddy OR Ayeyarwady OR Tanintharyi OR Salween"
    concepts: [environmental science, ecology]
