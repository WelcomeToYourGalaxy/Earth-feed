    query: "Sahel OR Lake Chad OR Niger Delta OR Volta Basin"
    concepts: [environmental science, ecology, hydrology]
    tier: peer_reviewed
    regions: [western_africa]
    lang: "en"
  - id: openalex-andes-amazon
